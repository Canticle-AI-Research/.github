<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">SEAM interfaces share one runtime</title>
  <desc id="desc">TUI, WebUI, MCP, and SDK interfaces connect to one SEAM runtime, which handles ingest, MIRL compilation, retrieval, PACK context, and refinement.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f780e2"/><stop offset=".5" stop-color="#c4a7e7"/><stop offset="1" stop-color="#7dcfff"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7dcfff" fill-opacity=".08"/></pattern>
    <filter id="interface-glow" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="330" rx="16" fill="#0b0c0e"/>
  <rect width="1200" height="330" rx="16" fill="url(#dots)"/>
  <path d="M0 51H1200" stroke="#3b3d57"/>
  <text x="26" y="32" fill="#fffdf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4">ONE RUNTIME / FOUR SURFACES</text>
  <text x="1174" y="32" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4">THIN, AUDITABLE ADAPTERS</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M206 161H468M732 161H994M600 113V88M600 209V236" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M458 154L470 161L458 168M742 154L730 161L742 168M593 98L600 86L607 98M593 226L600 238L607 226" fill="none" stroke="#c4a7e7" stroke-width="2"/>

    <g transform="translate(38 111)">
      <rect width="168" height="100" rx="9" fill="#18131b" stroke="#f780e2" filter="url(#interface-glow)"/>
      <text x="84" y="31" text-anchor="middle" fill="#f780e2" font-size="11" letter-spacing="2">OPERATOR</text>
      <text x="84" y="61" text-anchor="middle" fill="#fffdf5" font-size="20" font-weight="700">TUI</text>
      <text x="84" y="82" text-anchor="middle" fill="#a9b1d6" font-size="10">terminal surface</text>
    </g>
    <g transform="translate(469 111)">
      <rect width="262" height="100" rx="12" fill="#15141c" stroke="#c4a7e7" stroke-width="1.5"/>
      <text x="131" y="27" text-anchor="middle" fill="#c4a7e7" font-size="10" letter-spacing="2">SHARED CORE</text>
      <text x="131" y="58" text-anchor="middle" fill="#fffdf5" font-size="22" font-weight="700">SEAM RUNTIME</text>
      <text x="131" y="80" text-anchor="middle" fill="#a9b1d6" font-size="9.5">INGEST · MIRL · RETRIEVAL · PACK</text>
    </g>
    <g transform="translate(994 111)">
      <rect width="168" height="100" rx="9" fill="#111820" stroke="#7dcfff" filter="url(#interface-glow)"/>
      <text x="84" y="31" text-anchor="middle" fill="#7dcfff" font-size="11" letter-spacing="2">AGENTS</text>
      <text x="84" y="61" text-anchor="middle" fill="#fffdf5" font-size="20" font-weight="700">MCP</text>
      <text x="84" y="82" text-anchor="middle" fill="#a9b1d6" font-size="10">stdio bridge</text>
    </g>
    <g transform="translate(516 62)">
      <rect width="168" height="50" rx="8" fill="#12161c" stroke="#7dcfff" filter="url(#interface-glow)"/>
      <text x="84" y="22" text-anchor="middle" fill="#7dcfff" font-size="15" font-weight="700">SDK</text>
      <text x="84" y="38" text-anchor="middle" fill="#565f89" font-size="9">agent integration</text>
    </g>
    <g transform="translate(489 238)">
      <rect width="222" height="54" rx="8" fill="#101a18" stroke="#02bf87" filter="url(#interface-glow)"/>
      <text x="111" y="23" text-anchor="middle" fill="#73daca" font-size="15" font-weight="700">WEBUI</text>
      <text x="111" y="41" text-anchor="middle" fill="#565f89" font-size="9">browser surface</text>
    </g>

    <text x="38" y="276" fill="#565f89" font-size="10">Every surface calls the same core behavior.</text>
    <text x="1162" y="276" text-anchor="end" fill="#565f89" font-size="10">CLI + Canticle agent / in development</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="328.5" rx="15.25" fill="none" stroke="url(#edge)" stroke-opacity=".38" stroke-width="1.5"/>
</svg>
