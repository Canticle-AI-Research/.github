<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Canticle Research — Ghost in the SEAM</title>
  <desc id="desc">The Ghost in the SEAM cyber-anime shell, with RGB neural circuitry, beside the SEAM canonical memory path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070807"/>
      <stop offset=".58" stop-color="#11101a"/>
      <stop offset="1" stop-color="#09151a"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7768e"/>
      <stop offset=".16" stop-color="#ff9e64"/>
      <stop offset=".31" stop-color="#e0af68"/>
      <stop offset=".46" stop-color="#9ece6a"/>
      <stop offset=".62" stop-color="#7dcfff"/>
      <stop offset=".78" stop-color="#7aa2f7"/>
      <stop offset=".91" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f780e2"/>
      <stop offset=".56" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="ghost-halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#c4a7e7" stop-opacity=".26"/>
      <stop offset=".46" stop-color="#f780e2" stop-opacity=".12"/>
      <stop offset=".78" stop-color="#7dcfff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#070807" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7dcfff" stroke-opacity=".05"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H1200" stroke="#fff" stroke-opacity=".022"/>
    </pattern>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wide-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="500" rx="18"/></clipPath>
    <clipPath id="shell"><path d="M835 80H1171V500H805V118Z"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <ellipse cx="1006" cy="278" rx="290" ry="260" fill="url(#ghost-halo)"/>
    <path d="M808 500L1200 111V500Z" fill="#7dcfff" opacity=".026"/>

    <g aria-label="Canticle Research brand">
      <rect x="46" y="32" width="60" height="43" rx="9" fill="#0a0b0a" stroke="#f7768e" stroke-width="2" filter="url(#soft-glow)"/>
      <text x="59" y="62" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">❯</text>
      <rect x="87" y="44" width="9" height="20" fill="#f7768e"/>
      <text x="123" y="62" fill="#f780e2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" letter-spacing=".8">Canticle</text>
      <text x="125" y="82" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="3.2">INDEPENDENT AI RESEARCH</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <circle cx="525" cy="53" r="4" fill="#73daca" filter="url(#soft-glow)"/>
      <text x="538" y="57" fill="#73daca" font-size="10" letter-spacing="2">SOURCE LINK ACTIVE</text>
      <text x="798" y="57" fill="#565f89" font-size="9" letter-spacing="2">CONCEPT SHELL / IN DEVELOPMENT</text>
    </g>

    <path d="M0 101H1200" stroke="#3b3d57"/>
    <path d="M0 98H1200" stroke="url(#spectrum)" stroke-width="1" opacity=".38" filter="url(#soft-glow)"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="47" y="146" fill="#f780e2" font-size="11" font-weight="700" letter-spacing="3">GHOST IN THE SEAM / AGENT MEMORY</text>
      <text x="45" y="205" fill="#fffdf5" font-size="43">Memory with</text>
      <text x="45" y="258" fill="url(#headline)" font-size="50" font-weight="700" filter="url(#soft-glow)">evidence intact.</text>
      <text x="48" y="301" fill="#a9b1d6" font-size="15">A mind can move through the shell.</text>
      <text x="48" y="326" fill="#a9b1d6" font-size="15">Its memory should keep the receipts.</text>
    </g>

    <g aria-label="SEAM canonical memory rail" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="48" y="376" fill="#565f89" font-size="9" letter-spacing="2">CANONICAL MEMORY RAIL</text>
      <path d="M48 432H785" stroke="url(#spectrum)" stroke-width="2" stroke-dasharray="6 8" opacity=".75"/>
      <path d="M775 425L788 432L775 439" fill="none" stroke="#7dcfff" stroke-width="2"/>

      <g transform="translate(48 391)">
        <rect width="137" height="68" rx="8" fill="#18131b" stroke="#f780e2"/>
        <text x="68.5" y="28" text-anchor="middle" fill="#f780e2" font-size="14" font-weight="700">RAW</text>
        <text x="68.5" y="49" text-anchor="middle" fill="#a9b1d6" font-size="8" letter-spacing="1.2">EVIDENCE</text>
      </g>
      <g transform="translate(222 391)">
        <rect width="137" height="68" rx="8" fill="#17141c" stroke="#c4a7e7"/>
        <text x="68.5" y="28" text-anchor="middle" fill="#c4a7e7" font-size="14" font-weight="700">MIRL</text>
        <text x="68.5" y="49" text-anchor="middle" fill="#a9b1d6" font-size="8" letter-spacing="1.2">SEMANTICS</text>
      </g>
      <g transform="translate(396 391)">
        <rect width="137" height="68" rx="8" fill="#101a19" stroke="#73daca"/>
        <text x="68.5" y="28" text-anchor="middle" fill="#73daca" font-size="14" font-weight="700">SQLITE</text>
        <text x="68.5" y="49" text-anchor="middle" fill="#a9b1d6" font-size="8" letter-spacing="1.2">CANONICAL</text>
      </g>
      <g transform="translate(570 391)">
        <rect width="137" height="68" rx="8" fill="#111820" stroke="#7dcfff"/>
        <text x="68.5" y="28" text-anchor="middle" fill="#7dcfff" font-size="14" font-weight="700">PACK</text>
        <text x="68.5" y="49" text-anchor="middle" fill="#a9b1d6" font-size="8" letter-spacing="1.2">CONTEXT</text>
      </g>
    </g>

    <g aria-label="Experimental Ghost agent shell">
      <path d="M835 80H1171V500H805V118Z" fill="#0b0c0e" fill-opacity=".45" stroke="#7dcfff" stroke-opacity=".35"/>
      <path d="M835 80H1171" stroke="url(#spectrum)" stroke-width="2" filter="url(#soft-glow)"/>
      <ellipse cx="1008" cy="301" rx="160" ry="200" fill="#c4a7e7" opacity=".09" filter="url(#wide-glow)"/>
      <g clip-path="url(#shell)">
        <image x="794" y="72" width="425" height="465" preserveAspectRatio="xMidYMid meet" href="ghost-in-the-seam-character-v2.png" xlink:href="ghost-in-the-seam-character-v2.png"/>
        <rect x="805" y="80" width="366" height="420" fill="url(#scan)" opacity=".34"/>
      </g>
      <path d="M825 100V88H837M1157 88H1169V100M825 474V486H837M1157 486H1169V474" fill="none" stroke="#c4a7e7" stroke-width="2" opacity=".8"/>
      <g transform="translate(846 438)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect width="291" height="39" rx="6" fill="#070807" fill-opacity=".88" stroke="#3b3d57"/>
        <circle cx="17" cy="19.5" r="3.5" fill="#73daca" filter="url(#soft-glow)"/>
        <text x="31" y="17" fill="#fffdf5" font-size="9" font-weight="700" letter-spacing="1.5">GHOST // EXPERIMENTAL AGENT</text>
        <text x="31" y="31" fill="#565f89" font-size="7.5" letter-spacing="1.1">SHELL STATUS: SOURCE-LINKED</text>
      </g>
    </g>

    <rect width="1200" height="500" fill="url(#scan)" opacity=".55" pointer-events="none"/>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="17" fill="none" stroke="url(#spectrum)" stroke-opacity=".72" stroke-width="2"/>
</svg>
