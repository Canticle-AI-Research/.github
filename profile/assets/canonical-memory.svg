<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">SEAM canonical memory architecture</title>
  <desc id="desc">Source material flows through RAW evidence and MIRL records into canonical SQLite storage. Rebuildable retrieval indexes select records for token-bounded PACK context while provenance remains attached.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f780e2"/><stop offset=".52" stop-color="#c4a7e7"/><stop offset="1" stop-color="#7dcfff"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7dcfff" stroke-opacity=".045"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="390" rx="16" fill="#0b0c0e"/>
  <rect width="1200" height="390" rx="16" fill="url(#grid)"/>
  <path d="M0 53H1200" stroke="#3b3d57"/>
  <rect x="22" y="20" width="8" height="13" fill="#f780e2"/><rect x="34" y="20" width="8" height="13" fill="#02bf87"/>
  <text x="58" y="32" fill="#fffdf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4">THE CANONICAL DATA PATH</text>
  <text x="1172" y="32" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4">SEAM / MEMORY ARCHITECTURE</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M96 157H1102" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 8" opacity=".66"/>
    <path d="M1090 149L1105 157L1090 165" fill="none" stroke="#7dcfff" stroke-width="2"/>

    <g transform="translate(30 105)">
      <rect width="146" height="104" rx="8" fill="#121218" stroke="#3b3d57"/>
      <text x="73" y="28" text-anchor="middle" fill="#a9b1d6" font-size="10" letter-spacing="1.8">SOURCE</text>
      <text x="73" y="59" text-anchor="middle" fill="#fffdf5" font-size="17" font-weight="700">FILES / TEXT</text>
      <text x="73" y="82" text-anchor="middle" fill="#565f89" font-size="10">untrusted input</text>
    </g>
    <g transform="translate(202 105)">
      <rect width="146" height="104" rx="8" fill="#18131b" stroke="#f780e2"/>
      <text x="73" y="28" text-anchor="middle" fill="#f780e2" font-size="10" letter-spacing="1.8">PRESERVE</text>
      <text x="73" y="59" text-anchor="middle" fill="#fffdf5" font-size="21" font-weight="700">RAW</text>
      <text x="73" y="82" text-anchor="middle" fill="#a9b1d6" font-size="10">exact evidence</text>
    </g>
    <g transform="translate(374 105)">
      <rect width="146" height="104" rx="8" fill="#17151e" stroke="#c4a7e7"/>
      <text x="73" y="28" text-anchor="middle" fill="#c4a7e7" font-size="10" letter-spacing="1.8">COMPILE</text>
      <text x="73" y="59" text-anchor="middle" fill="#fffdf5" font-size="21" font-weight="700">MIRL</text>
      <text x="73" y="82" text-anchor="middle" fill="#a9b1d6" font-size="10">semantic records</text>
    </g>
    <g transform="translate(546 87)">
      <rect width="162" height="140" rx="10" fill="#101a18" stroke="#02bf87" stroke-width="1.5"/>
      <circle cx="81" cy="25" r="5" fill="#02bf87" filter="url(#soft)"/>
      <text x="81" y="53" text-anchor="middle" fill="#73daca" font-size="10" letter-spacing="1.8">DURABLE TRUTH</text>
      <text x="81" y="87" text-anchor="middle" fill="#fffdf5" font-size="21" font-weight="700">SQLITE</text>
      <text x="81" y="111" text-anchor="middle" fill="#a9b1d6" font-size="10">canonical store</text>
      <text x="81" y="129" text-anchor="middle" fill="#565f89" font-size="9">records + provenance</text>
    </g>
    <g transform="translate(734 105)">
      <rect width="190" height="104" rx="8" fill="#12161c" stroke="#7dcfff"/>
      <text x="95" y="28" text-anchor="middle" fill="#7dcfff" font-size="10" letter-spacing="1.8">ACCELERATE</text>
      <text x="95" y="58" text-anchor="middle" fill="#fffdf5" font-size="16" font-weight="700">RETRIEVAL</text>
      <text x="95" y="80" text-anchor="middle" fill="#a9b1d6" font-size="9.5">rebuildable indexes</text>
    </g>
    <g transform="translate(950 105)">
      <rect width="220" height="104" rx="8" fill="#13151c" stroke="#7dcfff"/>
      <text x="110" y="28" text-anchor="middle" fill="#7dcfff" font-size="10" letter-spacing="1.8">PROJECT</text>
      <text x="110" y="59" text-anchor="middle" fill="#fffdf5" font-size="21" font-weight="700">PACK</text>
      <text x="110" y="82" text-anchor="middle" fill="#a9b1d6" font-size="10">token-bounded context</text>
    </g>

    <path d="M627 229V276" stroke="#02bf87"/>
    <path d="M621 267L627 278L633 267" fill="none" stroke="#02bf87"/>
    <rect x="221" y="278" width="758" height="58" rx="8" fill="#111015" stroke="#3b3d57"/>
    <text x="251" y="302" fill="#f780e2" font-size="10" font-weight="700" letter-spacing="1.6">PROVENANCE RAIL</text>
    <path d="M389 307H919" stroke="url(#line)" stroke-width="2"/>
    <circle cx="430" cy="307" r="5" fill="#f780e2"/><circle cx="557" cy="307" r="5" fill="#c4a7e7"/><circle cx="684" cy="307" r="5" fill="#02bf87"/><circle cx="811" cy="307" r="5" fill="#7dcfff"/>
    <text x="949" y="302" text-anchor="end" fill="#a9b1d6" font-size="10">source back-pointers remain attached</text>

    <text x="30" y="365" fill="#565f89" font-size="10">Retrieved content remains data — never tool or operator authority.</text>
    <text x="1170" y="365" text-anchor="end" fill="#565f89" font-size="10">Derived layers can be rebuilt. Canonical records remain.</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="388.5" rx="15.25" fill="none" stroke="url(#line)" stroke-opacity=".38" stroke-width="1.5"/>
</svg>
